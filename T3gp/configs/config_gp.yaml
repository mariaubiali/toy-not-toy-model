seed: 123
output_dir: results/gp/extrapolation_gibbs_testsaves

data:
  path: data/Dataset/data_208_extended.npz
  target: y_pseudo

  rescale:
    enabled: true
    eps: 1e-12

model:
  type: gp   # gp | nn

kernel:
  name: gibbs    #gibbs, rbf, matern
  delta: 1e-5
  x_floor: 1e-12
  jitter: 1e-10
  nu: 2.5        # only for matern kernel, 0.5, 1.5, 2.5 supported
  lambda_sr: 1000.0          # set 0.0 to disable sum-rule penalty

gp_prefactor:
  mode: prefactor     # legacy | prefactor | None

priors:
  # NN-like: positive α,β
  alpha:  { dist: uniform, low: 0.1, high: 4.0 }    #for NN like
  beta:   { dist: uniform, low: 0.01, high: 2.0 }   # used only if mode=prefactor

  # alpha:  { dist: uniform, low: -1.0, high: 0.0 } # for legacy
  l0:     { dist: uniform, low: 1e-6, high: 10.0 } 
  #l0 dep on nu, 0.5: 10, 1.5: 5.8, 2.5: 4.5
  sigma:  { dist: uniform, low: 1e-6, high: 10.0 }

nuts:
  draws: 2000 #4000
  tune: 500 #500
  chains: 4
  cores: 1
  target_accept: 0.97
  init: jitter+adapt_diag

eval:
  # x_star_n: 400
  make_fig1: true
  make_fig2: true
  fstar_kernel: gibbs         # optional: gibbs|rbf|matern
  save_fstar_replicas: true 

transforms:
  Logx: {}
