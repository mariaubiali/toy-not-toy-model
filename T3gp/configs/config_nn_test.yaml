seed: 123
output_dir: results/chi2_L1_scan_var/a08_b20
seed: 123

data:
  path: data/Dataset/data_208_extended.npz
  target: y_pseudo

  rescale:
    enabled: true
    eps: 1e-12

model:
  type: nn   # gp | nn | ntk

nn:
  hidden: [32, 32, 32]
  activation: gelu
  out_dim: 2
  dropout: 0.001
  epochs: 5000
  lr: 5.0e-4
  weight_decay: 0.0
  patience: 500
  min_delta: 0.0
  grad_clip: null         # or e.g. 1.0
  device: cpu             # or cpu
  dtype: float32
  scaling: true    # true: nn scaling, false or none: no scaling, xalpha: GP scaling
  init_alpha: 0.8
  init_beta: 2.0

  ensemble:
    enabled: true
    n_members: 100
    seed_offset: 1000        # member i uses seed = seed + seed_offset + i
    save_member_preds: false # if true saves each member curve  

loss:
  name: chi2              # mse | weighted_mse | chi2_het | chi2 | mse_het
  jitter: 1.0e-10             # added to C before Cholesky
  lambda_sr: 0.0          # set 0.0 to disable sum-rule penalty
  full_cov: false
  full_cov_jitter_abs: 1e-12
  full_cov_jitter_rel: 1e-8

transforms:
  Logx: {}

