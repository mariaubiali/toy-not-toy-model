seed: 123
output_dir: results/ntk/init_testing_none

data:
  path: data/Dataset/data_208_extended.npz
  target: y_pseudo

  rescale:
    enabled: true
    eps: 1e-12

model:
  type: ntk  # gp | nn | ntk

nn:
  hidden: [32, 32, 32]
  activation: gelu
  out_dim: 1
  dropout: 0.001
  epochs: 5000
  lr: 5.0e-4
  weight_decay: 0.0
  patience: 500
  min_delta: 0.0
  grad_clip: null
  device: cpu
  dtype: float32
  scaling: true
  init_alpha: 1.0
  init_beta: 3.0

  ensemble:
    enabled: false
    n_members: 1
    seed_offset: 1000
    save_member_preds: false

loss:
  name: chi2
  jitter: 1.0e-10
  lambda_sr: 1000.0

transforms:
  Logx: {}
  Softplus: {}

ntk:
  # when: post
  mode: analytic_inf
  fallback_to_empirical_ref: false
  gp_eval: true
  use_data_cov: true
  ridge: 1e-6
  lambda: 1e-3
  max_train_points: 256
  max_pred_points: 512
  apply_scaling: false
  apply_sumrule: false
