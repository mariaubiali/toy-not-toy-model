seed: 123
output_dir: results/re_full
data:
  path: data/Dataset/data_208_extended.npz
  target: y_pseudo

  rescale:
    enabled: true
    eps: 1e-12

model:
  type: nn   # gp | nn | ntk

nn:
  hidden: [32, 32, 32]
  activation: gelu
  out_dim: 1
  dropout: 0.001
  epochs: 5000
  lr: 5.0e-4
  weight_decay: 0.0
  patience: 500
  scaling: true    # true: nn scaling, false or none: no scaling, xalpha: GP scaling
  init_alpha: 1.0
  init_beta: 3.0

  ensemble:
    enabled: true
    kind: repulsive
    n_members: 100
    seed_offset: 1000 
    save_member_preds: true

  repulsive:
    beta: 10.0
    prior_width: 1.0
    h: null
    init: kaiming
    kernel_space: xt3
    debug: false

loss:
  name: chi2             # mse | weighted_mse | chi2_het | chi2 | mse_het
  jitter: 1.0e-10             # added to C before Cholesky
  lambda_sr: 1000.0          # set 0.0 to disable sum-rule penalty

transforms:
  Logx: {}
  Softplus: {}
